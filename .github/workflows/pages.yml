name: Deploy AI Directory to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  repository_dispatch:
    types: [site-data-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[curate-videos]') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Generate SEO pages
        run: node scripts/build-seo-pages.mjs

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Check deployment freshness
        id: freshness
        shell: bash
        run: |
          git fetch --no-tags origin refs/heads/main
          latest_main_sha="$(git rev-parse FETCH_HEAD)"
          if [[ "$GITHUB_SHA" == "$latest_main_sha" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "Fresh deployment: $GITHUB_SHA is the current main commit."
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale deployment: workflow SHA $GITHUB_SHA; latest main SHA $latest_main_sha."
          fi

      - name: Deploy
        if: ${{ steps.freshness.outputs.current == 'true' }}
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify IndexNow
        if: ${{ steps.freshness.outputs.current == 'true' }}
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET

          try:
              sitemap_url = "https://starterhub-dev.github.io/ai-tools/sitemap.xml"
              root = ET.fromstring(urllib.request.urlopen(sitemap_url, timeout=30).read())
              ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
              urls = [node.text for node in root.findall("sm:url/sm:loc", ns) if node.text]

              payload = json.dumps({
                  "host": "starterhub-dev.github.io",
                  "key": "e9f3a6c1d7b24f8aa53e0b6c7d91f402",
                  "keyLocation": "https://starterhub-dev.github.io/ai-tools/e9f3a6c1d7b24f8aa53e0b6c7d91f402.txt",
                  "urlList": urls,
              }).encode("utf-8")

              request = urllib.request.Request(
                  "https://api.indexnow.org/indexnow",
                  data=payload,
                  headers={"Content-Type": "application/json; charset=utf-8"},
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  print("IndexNow response:", response.status)
              print("IndexNow submitted", len(urls), "URLs")
          except urllib.error.HTTPError as error:
              print("IndexNow returned HTTP", error.code)
          except Exception as error:
              print("IndexNow notification skipped:", error)
          PY
