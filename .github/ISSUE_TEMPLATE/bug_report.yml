name: Website feedback / 网站问题反馈
description: Report a broken link, outdated information, or a site issue.
title: "[Feedback] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve AI Starter Hub. Please report one issue per submission. Do not include passwords, API keys, or other private information.
  - type: dropdown
    id: issue_type
    attributes:
      label: 遇到了什么问题？ / What needs attention?
      options:
        - 官网链接失效 / Broken official link
        - 价格或免费额度信息过期 / Outdated pricing or free-tier information
        - 教程或视频问题 / Tutorial or video problem
        - 搜索或分类问题 / Search or category issue
        - 手机布局或无障碍问题 / Mobile layout or accessibility issue
        - 其他 / Other
    validations:
      required: true
  - type: input
    id: page_url
    attributes:
      label: 受影响的页面链接 / Affected page URL
      description: Paste the AI Starter Hub page where you noticed the issue.
      placeholder: https://starterhub-dev.github.io/ai-tools/...
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 你发现了什么？ / What did you notice?
      description: Tell us what happened and how we can reproduce it.
      placeholder: Steps to reproduce, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备或浏览器（可选） / Device or browser (optional)
      placeholder: Android + Chrome, Windows + Firefox, etc.
    validations:
      required: false
